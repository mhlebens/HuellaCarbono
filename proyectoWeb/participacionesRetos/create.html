<!doctype html>
<html lang="es">
  <head>
    <title>Crear / Editar Participación - HuellaCarbono</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <style>
      :root { --verde: #2e7d32; --verde-claro: #4caf50; }
      body { background-color: #f1f8e9; }
      .navbar { background-color: var(--verde) !important; }
      .titulo-pagina { color: var(--verde); font-weight: 700; border-left: 4px solid var(--verde-claro); padding-left: 10px; }
      .card-form { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
      .btn-guardar { background-color: var(--verde-claro); border: none; }
      .btn-guardar:hover { background-color: var(--verde); }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-leaf-fill me-2"></i>HuellaCarbono DB</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html"><i class="bi bi-arrow-left me-1"></i>Volver a Participaciones</a>
        </div>
      </div>
    </nav>

    <div class="container py-4" style="max-width: 640px">
      <h3 class="titulo-pagina mb-4" id="tituloFormulario">
        <i class="bi bi-flag-fill me-2"></i>Nueva Participación en Reto
      </h3>

      <div id="alerta" class="alert d-none" role="alert"></div>

      <div class="card card-form">
        <div class="card-body p-4">

          <!-- ID Participación -->
          <div class="mb-3">
            <label for="id_participacion" class="form-label fw-semibold">ID Participación</label>
            <input type="number" class="form-control" id="id_participacion" placeholder="Ej: 1" min="1" required />
          </div>

          <!-- Usuario (select cargado dinámicamente) -->
          <div class="mb-3">
            <label for="usuario_id" class="form-label fw-semibold">Usuario</label>
            <select class="form-select" id="usuario_id" required>
              <option value="">Cargando usuarios...</option>
            </select>
          </div>

          <!-- Reto (select cargado dinámicamente) -->
          <div class="mb-3">
            <label for="reto_id" class="form-label fw-semibold">Reto</label>
            <select class="form-select" id="reto_id" required>
              <option value="">Cargando retos...</option>
            </select>
          </div>

          <!-- Fecha Inicio -->
          <div class="mb-3">
            <label for="fecha_inicio" class="form-label fw-semibold">Fecha de Inicio</label>
            <input type="date" class="form-control" id="fecha_inicio" required />
          </div>

          <!-- Estado -->
          <div class="mb-3">
            <label for="estado" class="form-label fw-semibold">Estado</label>
            <select class="form-select" id="estado" required>
              <option value="">Seleccione un estado...</option>
              <option value="En progreso">En progreso</option>
              <option value="Completado">Completado</option>
              <option value="Abandonado">Abandonado</option>
            </select>
          </div>

          <!-- Botones -->
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-guardar btn-success text-white flex-grow-1" id="btnGuardar">
              <i class="bi bi-floppy-fill me-1"></i>Guardar
            </button>
            <a href="index.html" class="btn btn-outline-secondary">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="../app.js"></script>
    <script>
      // Cargar select de retos
      async function cargarRetosEnSelect(idSelect) {
        const select = document.getElementById(idSelect);
        if (!select) return;
        try {
          const retos = await apiFetch(`${BASE_URL}/retos`);
          select.innerHTML = `<option value="">Seleccione un reto...</option>`;
          if (!retos.length) {
            select.innerHTML = `<option value="">No hay retos registrados</option>`;
            return;
          }
          retos.forEach((r) => {
            const option = document.createElement("option");
            option.value = r._id;
            option.textContent = `${r.titulo} (${r.dificultad || "sin dificultad"})`;
            select.appendChild(option);
          });
        } catch {
          select.innerHTML = `<option value="">Error al cargar retos</option>`;
        }
      }

      // Sobreescribir guardarParticipacionReto para que use los selects
      async function guardarParticipacionReto(id) {
        const datos = {
          id_participacion: parseInt(document.getElementById("id_participacion")?.value),
          usuario_id: document.getElementById("usuario_id")?.value,
          reto_id: document.getElementById("reto_id")?.value,
          fecha_inicio: document.getElementById("fecha_inicio")?.value || null,
          estado: document.getElementById("estado")?.value,
        };

        if (
          isNaN(datos.id_participacion) ||
          !datos.usuario_id ||
          !datos.reto_id ||
          !datos.fecha_inicio ||
          !datos.estado
        ) {
          mostrarAlerta("Por favor completa todos los campos requeridos.", "danger");
          return;
        }

        try {
          const url = id
            ? `${BASE_URL}/participaciones-retos/${id}`
            : `${BASE_URL}/participaciones-retos`;
          const method = id ? "PUT" : "POST";
          await apiFetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });
          mostrarAlerta(
            id ? "Participación actualizada correctamente." : "Participación creada correctamente."
          );
          redirigir("index.html");
        } catch {
          mostrarAlerta("Error al guardar la participación.", "danger");
        }
      }

      // Sobreescribir cargarParticipacionRetoEnFormulario para usar selects
      async function cargarParticipacionRetoEnFormulario(id) {
        try {
          const p = await apiFetch(`${BASE_URL}/participaciones-retos/${id}`);
          document.getElementById("id_participacion").value = p.id_participacion ?? "";
          document.getElementById("usuario_id").value = p.usuario_id?._id || p.usuario_id || "";
          document.getElementById("reto_id").value = p.reto_id?._id || p.reto_id || "";
          document.getElementById("fecha_inicio").value = p.fecha_inicio
            ? new Date(p.fecha_inicio).toISOString().split("T")[0]
            : "";
          document.getElementById("estado").value = p.estado || "En progreso";
        } catch {
          mostrarAlerta("No se pudo cargar la participación.", "danger");
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const id = obtenerIdDeURL();

        // Cargar los selects en paralelo
        await Promise.all([
          cargarUsuariosEnSelect("usuario_id"),
          cargarRetosEnSelect("reto_id"),
        ]);

        if (id) {
          document.getElementById("tituloFormulario").innerHTML =
            '<i class="bi bi-pencil-square me-2"></i>Editar Participación en Reto';
          await cargarParticipacionRetoEnFormulario(id);
        }

        document.getElementById("btnGuardar").addEventListener("click", () => guardarParticipacionReto(id));
      });
    </script>
  </body>
</html>
