<!doctype html>
<html lang="es">
  <head>
    <title>Crear / Editar Recomendación - HuellaCarbono</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --verde: #2e7d32;
        --verde-claro: #4caf50;
      }
      body {
        background-color: #f1f8e9;
      }
      .navbar {
        background-color: var(--verde) !important;
      }
      .titulo-pagina {
        color: var(--verde);
        font-weight: 700;
        border-left: 4px solid var(--verde-claro);
        padding-left: 10px;
      }
      .card-form {
        border: none;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../../index.html"
          ><i class="bi bi-leaf-fill me-2"></i>HuellaCarbono DB</a
        >
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html"
            ><i class="bi bi-arrow-left me-1"></i>Volver a Recomendaciones</a
          >
        </div>
      </div>
    </nav>

    <div class="container py-4" style="max-width: 640px">
      <h3 class="titulo-pagina mb-4" id="tituloFormulario">
        <i class="bi bi-lightbulb-fill me-2"></i>Nueva Recomendación
      </h3>
      <div id="alerta" class="alert d-none" role="alert"></div>
      <div class="card card-form">
        <div class="card-body p-4">
          <div class="mb-3">
            <label for="id_recomendacion" class="form-label fw-semibold"
              >ID Recomendación</label
            >
            <input
              type="text"
              class="form-control"
              id="id_recomendacion"
              placeholder="Ej: REC001"
              required
            />
          </div>

          <div class="mb-3">
            <label for="tipo" class="form-label fw-semibold">Tipo</label>
            <select class="form-select" id="tipo" required>
              <option value="">Seleccione...</option>
              <option value="alimentacion">Alimentación</option>
              <option value="transporte">Transporte</option>
              <option value="energia">Energía</option>
              <option value="residuos">Residuos</option>
              <option value="agua">Agua</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="texto" class="form-label fw-semibold"
              >Texto de la Recomendación</label
            >
            <textarea
              class="form-control"
              id="texto"
              rows="4"
              placeholder="Ej: Reduce el consumo de carne roja al menos 2 veces por semana."
              required
            ></textarea>
          </div>

          <div class="mb-4">
            <label for="impacto_estimado" class="form-label fw-semibold"
              >Impacto Estimado</label
            >
            <input
              type="text"
              class="form-control"
              id="impacto_estimado"
              placeholder="Ej: -5 kgCO₂/mes o 'Bajo', 'Medio', 'Alto'"
            />
          </div>

          <div class="d-flex gap-2">
            <button
              type="button"
              class="btn btn-success flex-grow-1"
              id="btnGuardar"
            >
              <i class="bi bi-floppy-fill me-1"></i>Guardar
            </button>
            <a href="index.html" class="btn btn-outline-secondary"
              ><i class="bi bi-x-lg me-1"></i>Cancelar</a
            >
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script src="../app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const id = obtenerIdDeURL();

        if (id) {
          document.getElementById("tituloFormulario").innerHTML =
            '<i class="bi bi-pencil-square me-2"></i>Editar Recomendación';
          cargarRecomendacionEnFormulario(id);
        }

        document
          .getElementById("btnGuardar")
          .addEventListener("click", () => guardarRecomendacion(id));
      });
    </script>
  </body>
</html>
