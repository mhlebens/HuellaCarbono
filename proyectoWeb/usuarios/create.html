<!doctype html>
<html lang="es">
  <head>
    <title>Crear / Editar Usuario - HuellaCarbono</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --verde: #2e7d32;
        --verde-claro: #4caf50;
      }
      body {
        background-color: #f1f8e9;
      }
      .navbar {
        background-color: var(--verde) !important;
      }
      .titulo-pagina {
        color: var(--verde);
        font-weight: 700;
        border-left: 4px solid var(--verde-claro);
        padding-left: 10px;
      }
      .card-form {
        border: none;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .btn-guardar {
        background-color: var(--verde-claro);
        border: none;
      }
      .btn-guardar:hover {
        background-color: var(--verde);
      }
      .seccion-perfil {
        background-color: #f8fdf8;
        border: 1px solid #c8e6c9;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 1rem;
      }
      .seccion-perfil legend {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--verde);
        padding: 0 6px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">
          <i class="bi bi-leaf-fill me-2"></i>HuellaCarbono DB
        </a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html">
            <i class="bi bi-arrow-left me-1"></i>Volver a Usuarios
          </a>
        </div>
      </div>
    </nav>

    <div class="container py-4" style="max-width: 640px">
      <h3 class="titulo-pagina mb-4" id="tituloFormulario">
        <i class="bi bi-person-plus-fill me-2"></i>Nuevo Usuario
      </h3>

      <div id="alerta" class="alert d-none" role="alert"></div>

      <div class="card card-form">
        <div class="card-body p-4">
          <!-- ID Usuario -->
          <div class="mb-3">
            <label for="id_usuario" class="form-label fw-semibold"
              >ID Usuario</label
            >
            <input
              type="number"
              class="form-control"
              id="id_usuario"
              placeholder="Ej: 1"
              min="1"
              required
            />
          </div>

          <!-- Nombre -->
          <div class="mb-3">
            <label for="nombre" class="form-label fw-semibold"
              >Nombre Completo</label
            >
            <input
              type="text"
              class="form-control"
              id="nombre"
              placeholder="Ej: Ana Martínez"
              required
            />
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Ej: ana@example.com"
              required
            />
          </div>

          <!-- Fecha de Registro -->
          <div class="mb-3">
            <label for="fecha_registro" class="form-label fw-semibold"
              >Fecha de Registro</label
            >
            <input type="date" class="form-control" id="fecha_registro" />
          </div>

          <!-- Perfil (objeto anidado) -->
          <fieldset class="seccion-perfil mb-4">
            <legend><i class="bi bi-person-badge me-1"></i>Perfil</legend>

            <div class="mb-3">
              <label for="perfil_pais" class="form-label fw-semibold"
                >País</label
              >
              <input
                type="text"
                class="form-control"
                id="perfil_pais"
                placeholder="Ej: México"
                required
              />
            </div>

            <div class="mb-0">
              <label
                for="perfil_nivel_conciencia"
                class="form-label fw-semibold"
              >
                Nivel de Conciencia Ecológica
              </label>
              <select class="form-select" id="perfil_nivel_conciencia" required>
                <option value="">Seleccione un nivel...</option>
                <option value="Principiante">Principiante</option>
                <option value="Intermedio">Intermedio</option>
                <option value="Avanzado">Avanzado</option>
              </select>
            </div>
          </fieldset>

          <!-- Botones -->
          <div class="d-flex gap-2">
            <button
              type="button"
              class="btn btn-guardar btn-success text-white flex-grow-1"
              id="btnGuardar"
            >
              <i class="bi bi-floppy-fill me-1"></i>Guardar
            </button>
            <a href="index.html" class="btn btn-outline-secondary">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>

    <!-- app.js provee: apiFetch, mostrarAlerta, obtenerIdDeURL, redirigir, BASE_URL -->
    <script src="../app.js"></script>

    <script>
      // Reemplaza guardarUsuario de app.js para construir perfil como objeto anidado
      async function guardarUsuario(id) {
        const datos = {
          id_usuario: parseInt(document.getElementById("id_usuario")?.value),
          nombre: document.getElementById("nombre")?.value.trim(),
          email: document.getElementById("email")?.value.trim(),
          fecha_registro:
            document.getElementById("fecha_registro")?.value || null,
          perfil: {
            pais: document.getElementById("perfil_pais")?.value.trim(),
            nivel_conciencia: document.getElementById("perfil_nivel_conciencia")
              ?.value,
          },
        };

        // Validación
        if (
          isNaN(datos.id_usuario) ||
          !datos.nombre ||
          !datos.email ||
          !datos.perfil.pais ||
          !datos.perfil.nivel_conciencia
        ) {
          mostrarAlerta(
            "Por favor completá todos los campos requeridos.",
            "danger",
          );
          return;
        }

        try {
          const url = id
            ? `${BASE_URL}/usuarios/${id}`
            : `${BASE_URL}/usuarios`;
          const method = id ? "PUT" : "POST";
          await apiFetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos),
          });
          mostrarAlerta(
            id
              ? "Usuario actualizado correctamente."
              : "Usuario creado correctamente.",
          );
          redirigir("index.html");
        } catch {
          mostrarAlerta("Error al guardar el usuario.", "danger");
        }
      }

      // Reemplaza cargarUsuarioEnFormulario de app.js para leer perfil como objeto anidado
      async function cargarUsuarioEnFormulario(id) {
        try {
          const u = await apiFetch(`${BASE_URL}/usuarios/${id}`);
          document.getElementById("id_usuario").value = u.id_usuario ?? "";
          document.getElementById("nombre").value = u.nombre || "";
          document.getElementById("email").value = u.email || "";
          document.getElementById("perfil_pais").value = u.perfil?.pais || "";
          document.getElementById("perfil_nivel_conciencia").value =
            u.perfil?.nivel_conciencia || "";
          if (u.fecha_registro) {
            document.getElementById("fecha_registro").value = new Date(
              u.fecha_registro,
            )
              .toISOString()
              .split("T")[0];
          }
        } catch {
          mostrarAlerta("No se pudo cargar el usuario.", "danger");
        }
      }

      // Inicialización
      document.addEventListener("DOMContentLoaded", () => {
        const id = obtenerIdDeURL();

        if (id) {
          document.getElementById("tituloFormulario").innerHTML =
            '<i class="bi bi-pencil-square me-2"></i>Editar Usuario';
          cargarUsuarioEnFormulario(id);
        }

        document
          .getElementById("btnGuardar")
          .addEventListener("click", () => guardarUsuario(id));
      });
    </script>
  </body>
</html>
