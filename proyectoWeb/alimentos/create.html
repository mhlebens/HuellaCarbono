<!doctype html>
<html lang="es">
  <head>
    <title>Crear / Editar Alimento - HuellaCarbono</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --verde: #2e7d32;
        --verde-claro: #4caf50;
      }
      body {
        background-color: #f1f8e9;
      }
      .navbar {
        background-color: var(--verde) !important;
      }
      .titulo-pagina {
        color: var(--verde);
        font-weight: 700;
        border-left: 4px solid var(--verde-claro);
        padding-left: 10px;
      }
      .card-form {
        border: none;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .btn-guardar {
        background-color: var(--verde-claro);
        border: none;
      }
      .btn-guardar:hover {
        background-color: var(--verde);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">
          <i class="bi bi-leaf-fill me-2"></i>HuellaCarbono DB
        </a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html">
            <i class="bi bi-arrow-left me-1"></i>Volver a Alimentos
          </a>
        </div>
      </div>
    </nav>

    <div class="container py-4" style="max-width: 640px">
      <h3 class="titulo-pagina mb-4" id="tituloFormulario">
        <i class="bi bi-basket-fill me-2"></i>Nuevo Alimento
      </h3>

      <div id="alerta" class="alert d-none" role="alert"></div>

      <div class="card card-form">
        <div class="card-body p-4">
          <div class="mb-3">
            <label for="id_alimento" class="form-label fw-semibold">ID Alimento</label>
            <input
              type="number"
              class="form-control"
              id="id_alimento"
              min="1"
              placeholder="Ej: 1"
              required
            />
          </div>

          <div class="mb-3">
            <label for="categoria" class="form-label fw-semibold">Categoría</label>
            <input
              type="text"
              class="form-control"
              id="categoria"
              placeholder="Ej: Carne de Res"
              required
            />
          </div>

          <div class="mb-3">
            <label for="co2_por_kg" class="form-label fw-semibold">CO2 por Kg</label>
            <input
              type="number"
              step="0.01"
              min="0"
              class="form-control"
              id="co2_por_kg"
              placeholder="Ej: 27"
              required
            />
          </div>

          <div class="mb-4">
            <label for="impacto_alto" class="form-label fw-semibold">Impacto Alto</label>
            <select class="form-select" id="impacto_alto" required>
              <option value="">Seleccione una opción...</option>
              <option value="true">Sí</option>
              <option value="false">No</option>
            </select>
          </div>

          <div class="d-flex gap-2">
            <button
              type="button"
              class="btn btn-guardar btn-success text-white flex-grow-1"
              id="btnGuardar"
            >
              <i class="bi bi-floppy-fill me-1"></i>Guardar
            </button>
            <a href="index.html" class="btn btn-outline-secondary">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="../app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const id = obtenerIdDeURL();

        if (id) {
          document.getElementById("tituloFormulario").innerHTML =
            '<i class="bi bi-pencil-square me-2"></i>Editar Alimento';
          cargarAlimentoEnFormulario(id);
        }

        document
          .getElementById("btnGuardar")
          .addEventListener("click", () => guardarAlimento(id));
      });
    </script>
  </body>
</html>
