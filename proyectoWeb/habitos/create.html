<!doctype html>
<html lang="es">
  <head>
    <title>Crear / Editar Hábito - HuellaCarbono</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --verde: #2e7d32;
        --verde-claro: #4caf50;
      }
      body {
        background-color: #f1f8e9;
      }
      .navbar {
        background-color: var(--verde) !important;
      }
      .titulo-pagina {
        color: var(--verde);
        font-weight: 700;
        border-left: 4px solid var(--verde-claro);
        padding-left: 10px;
      }
      .card-form {
        border: none;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .btn-guardar {
        background-color: var(--verde-claro);
        border: none;
      }
      .btn-guardar:hover {
        background-color: var(--verde);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand-lg">
      <div class="container">
        <!-- FIX: era ../../index.html, un nivel de más -->
        <a class="navbar-brand fw-bold" href="../index.html">
          <i class="bi bi-leaf-fill me-2"></i>HuellaCarbono DB
        </a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html">
            <i class="bi bi-arrow-left me-1"></i>Volver a Hábitos
          </a>
        </div>
      </div>
    </nav>

    <div class="container py-4" style="max-width: 640px">
      <h3 class="titulo-pagina mb-4" id="tituloFormulario">
        <i class="bi bi-heart-pulse-fill me-2"></i>Nuevo Hábito
      </h3>

      <div id="alerta" class="alert d-none" role="alert"></div>

      <div class="card card-form">
        <div class="card-body p-4">
          <!-- FIX: type="number" porque en la BD es NumberInt -->
          <div class="mb-3">
            <label for="id_habito" class="form-label fw-semibold"
              >ID Hábito</label
            >
            <input
              type="number"
              class="form-control"
              id="id_habito"
              placeholder="Ej: 1"
              min="1"
              required
            />
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label fw-semibold"
              >Descripción</label
            >
            <textarea
              class="form-control"
              id="descripcion"
              rows="3"
              placeholder="Ej: Usar bicicleta para ir al trabajo"
              required
            ></textarea>
          </div>

          <!-- FIX: valores en Title Case para que coincidan con los datos reales de la BD -->
          <div class="mb-3">
            <label for="categoria" class="form-label fw-semibold"
              >Categoría</label
            >
            <select class="form-select" id="categoria" required>
              <option value="">Seleccione una categoría...</option>
              <option value="Transporte">Transporte</option>
              <option value="Alimentación">Alimentación</option>
              <option value="Energía">Energía</option>
              <option value="Residuos">Residuos</option>
              <option value="Agua">Agua</option>
              <option value="Compras">Compras</option>
            </select>
          </div>

          <div class="mb-4">
            <label for="puntos_eco" class="form-label fw-semibold"
              >Puntos Eco</label
            >
            <input
              type="number"
              class="form-control"
              id="puntos_eco"
              min="0"
              placeholder="Ej: 50"
              required
            />
          </div>

          <div class="d-flex gap-2">
            <button
              type="button"
              class="btn btn-guardar btn-success text-white flex-grow-1"
              id="btnGuardar"
            >
              <i class="bi bi-floppy-fill me-1"></i>Guardar
            </button>
            <a href="index.html" class="btn btn-outline-secondary">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>

    <!-- app.js provee todo lo necesario: guardarHabito, cargarHabitoEnFormulario,
         obtenerIdDeURL, mostrarAlerta, redirigir, BASE_URL
         No se necesitan overrides porque los campos coinciden exactamente con la BD -->
    <script src="../app.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const id = obtenerIdDeURL();

        if (id) {
          // FIX: era "Editar ábito" (faltaba la H)
          document.getElementById("tituloFormulario").innerHTML =
            '<i class="bi bi-pencil-square me-2"></i>Editar Hábito';
          cargarHabitoEnFormulario(id);
        }

        document
          .getElementById("btnGuardar")
          .addEventListener("click", () => guardarHabito(id));
      });
    </script>
  </body>
</html>
