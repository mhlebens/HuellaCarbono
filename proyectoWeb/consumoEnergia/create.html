<!doctype html>
<html lang="es">
  <head>
    <title>Crear / Editar Consumo de Energía - HuellaCarbono</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <style>
      :root { --verde: #2e7d32; --verde-claro: #4caf50; }
      body { background-color: #f1f8e9; }
      .navbar { background-color: var(--verde) !important; }
      .titulo-pagina { color: var(--verde); font-weight: 700; border-left: 4px solid var(--verde-claro); padding-left: 10px; }
      .card-form { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
      .btn-guardar { background-color: var(--verde-claro); border: none; }
      .btn-guardar:hover { background-color: var(--verde); }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-leaf-fill me-2"></i>HuellaCarbono DB</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html"><i class="bi bi-arrow-left me-1"></i>Volver a Consumo de Energía</a>
        </div>
      </div>
    </nav>

    <div class="container py-4" style="max-width: 640px">
      <h3 class="titulo-pagina mb-4" id="tituloFormulario">
        <i class="bi bi-lightning-charge-fill me-2"></i>Nuevo Consumo de Energía
      </h3>

      <div id="alerta" class="alert d-none" role="alert"></div>

      <div class="card card-form">
        <div class="card-body p-4">

          <!-- ID Energía -->
          <div class="mb-3">
            <label for="id_energia" class="form-label fw-semibold">ID Energía</label>
            <input type="number" class="form-control" id="id_energia" placeholder="Ej: 1" min="1" required />
          </div>

          <!-- Tipo -->
          <div class="mb-3">
            <label for="tipo" class="form-label fw-semibold">Tipo de Fuente</label>
            <input type="text" class="form-control" id="tipo" placeholder="Ej: Electricidad Red Pública" required />
          </div>

          <!-- Unidad -->
          <div class="mb-3">
            <label for="unidad" class="form-label fw-semibold">Unidad de Medida</label>
            <input type="text" class="form-control" id="unidad" placeholder="Ej: kWh" required />
          </div>

          <!-- Factor -->
          <div class="mb-3">
            <label for="factor" class="form-label fw-semibold">Factor de Emisión CO₂</label>
            <div class="input-group">
              <input type="number" step="0.0001" class="form-control" id="factor" placeholder="Ej: 0.45" min="0" required />
              <span class="input-group-text text-muted">kg CO₂/unidad</span>
            </div>
          </div>

          <!-- Botones -->
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-guardar btn-success text-white flex-grow-1" id="btnGuardar">
              <i class="bi bi-floppy-fill me-1"></i>Guardar
            </button>
            <a href="index.html" class="btn btn-outline-secondary">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="../app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const id = obtenerIdDeURL();

        if (id) {
          document.getElementById("tituloFormulario").innerHTML =
            '<i class="bi bi-pencil-square me-2"></i>Editar Consumo de Energía';
          cargarConsumoEnergiaEnFormulario(id);
        }

        document.getElementById("btnGuardar").addEventListener("click", () => guardarConsumoEnergia(id));
      });
    </script>
  </body>
</html>
