<!doctype html>
<html lang="es">
  <head>
    <title>Crear / Editar Registro Diario - HuellaCarbono</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2NPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --verde: #2e7d32;
        --verde-claro: #4caf50;
      }
      body {
        background-color: #f1f8e9;
      }
      .navbar {
        background-color: var(--verde) !important;
      }
      .titulo-pagina {
        color: var(--verde);
        font-weight: 700;
        border-left: 4px solid var(--verde-claro);
        padding-left: 10px;
      }
      .card-form {
        border: none;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .actividad-item {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .actividad-item input {
        flex: 1;
      }
      .btn-add-act {
        background-color: var(--verde-suave, #e8f5e9);
        border: 1px dashed var(--verde-claro);
        color: var(--verde);
      }
      .btn-add-act:hover {
        background-color: #c8e6c9;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../../index.html"
          ><i class="bi bi-leaf-fill me-2"></i>HuellaCarbono DB</a
        >
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html"
            ><i class="bi bi-arrow-left me-1"></i>Volver a Registros</a
          >
        </div>
      </div>
    </nav>

    <div class="container py-4" style="max-width: 680px">
      <h3 class="titulo-pagina mb-4" id="tituloFormulario">
        <i class="bi bi-calendar2-plus-fill me-2"></i>Nuevo Registro Diario
      </h3>
      <div id="alerta" class="alert d-none" role="alert"></div>
      <div class="card card-form">
        <div class="card-body p-4">
          <div class="mb-3">
            <label for="id_registro" class="form-label fw-semibold"
              >ID Registro</label
            >
            <input
              type="text"
              class="form-control"
              id="id_registro"
              placeholder="Ej: REG001"
              required
            />
          </div>

          <div class="mb-3">
            <label for="usuario_id" class="form-label fw-semibold"
              >Usuario ID</label
            >
            <input
              type="text"
              class="form-control"
              id="usuario_id"
              placeholder="Ej: USR001"
              required
            />
          </div>

          <div class="mb-3">
            <label for="fecha" class="form-label fw-semibold">Fecha</label>
            <input type="date" class="form-control" id="fecha" required />
          </div>

          <!-- Actividades dinámicas -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Actividades</label>
            <div id="listaActividades">
              <div class="actividad-item">
                <input
                  type="text"
                  class="form-control actividad-input"
                  placeholder="Ej: Usé bicicleta al trabajo"
                />
                <button
                  type="button"
                  class="btn btn-sm btn-outline-danger btn-quitar-act"
                  title="Quitar"
                >
                  <i class="bi bi-dash-lg"></i>
                </button>
              </div>
            </div>
            <button
              type="button"
              class="btn btn-add-act btn-sm mt-2 w-100"
              id="btnAgregarActividad"
            >
              <i class="bi bi-plus-lg me-1"></i>Agregar actividad
            </button>
          </div>

          <div class="d-flex gap-2">
            <button
              type="button"
              class="btn btn-success flex-grow-1"
              id="btnGuardar"
            >
              <i class="bi bi-floppy-fill me-1"></i>Guardar
            </button>
            <a href="index.html" class="btn btn-outline-secondary"
              ><i class="bi bi-x-lg me-1"></i>Cancelar</a
            >
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script src="../app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const id = obtenerIdDeURL();

        if (id) {
          document.getElementById("tituloFormulario").innerHTML =
            '<i class="bi bi-pencil-square me-2"></i>Editar Registro';
          cargarRegistroEnFormulario(id); // ya reconstruye las filas de actividades
        } else {
          // Fecha de hoy por defecto
          document.getElementById("fecha").value = new Date()
            .toISOString()
            .split("T")[0];
          agregarFilaActividad(""); // fila inicial vacía
        }

        document
          .getElementById("btnAgregarActividad")
          .addEventListener("click", () => agregarFilaActividad(""));

        document
          .getElementById("btnGuardar")
          .addEventListener("click", () => guardarRegistroDiario(id));
      });
    </script>
  </body>
</html>
