<!doctype html>
<html lang="es">
  <head>
    <title>Crear / Editar Registro Diario - HuellaCarbono</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2NPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --verde: #2e7d32;
        --verde-claro: #4caf50;
      }
      body {
        background-color: #f1f8e9;
      }
      .navbar {
        background-color: var(--verde) !important;
      }
      .titulo-pagina {
        color: var(--verde);
        font-weight: 700;
        border-left: 4px solid var(--verde-claro);
        padding-left: 10px;
      }
      .card-form {
        border: none;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .seccion-actividades {
        background-color: #e8f5e9;
        border-radius: 8px;
        padding: 16px;
        border: 1px solid #c8e6c9;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../../index.html"
          ><i class="bi bi-leaf-fill me-2"></i>HuellaCarbono DB</a
        >
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html"
            ><i class="bi bi-arrow-left me-1"></i>Volver a Registros</a
          >
        </div>
      </div>
    </nav>

    <div class="container py-4" style="max-width: 680px">
      <h3 class="titulo-pagina mb-4" id="tituloFormulario">
        <i class="bi bi-calendar2-plus-fill me-2"></i>Nuevo Registro Diario
      </h3>
      <div id="alerta" class="alert d-none" role="alert"></div>
      <div class="card card-form">
        <div class="card-body p-4">
          <!-- ID Registro -->
          <div class="mb-3">
            <label for="id_registro" class="form-label fw-semibold"
              >ID Registro <span class="text-danger">*</span></label
            >
            <input
              type="number"
              class="form-control"
              id="id_registro"
              placeholder="Ej: 1"
              required
            />
          </div>

          <!-- Usuario ID (ObjectId) -->
          <div class="mb-3">
            <label for="usuario_id" class="form-label fw-semibold"
              >Usuario ID (ObjectId) <span class="text-danger">*</span></label
            >
            <input
              type="text"
              class="form-control font-monospace"
              id="usuario_id"
              placeholder="Ej: 682abc123def456789012345"
              required
            />
            <div class="form-text">
              Pega el <code>_id</code> del usuario de MongoDB.
            </div>
          </div>

          <!-- Fecha -->
          <div class="mb-4">
            <label for="fecha" class="form-label fw-semibold"
              >Fecha <span class="text-danger">*</span></label
            >
            <input type="date" class="form-control" id="fecha" required />
          </div>

          <!-- Actividades del día -->
          <div class="seccion-actividades mb-4">
            <p class="fw-semibold text-success mb-3">
              <i class="bi bi-activity me-1"></i>Actividades del día
            </p>

            <div class="mb-3">
              <label for="km_recorridos" class="form-label"
                >Kilómetros recorridos</label
              >
              <div class="input-group">
                <input
                  type="number"
                  class="form-control"
                  id="km_recorridos"
                  placeholder="0"
                  min="0"
                  step="0.1"
                />
                <span class="input-group-text">km</span>
              </div>
            </div>

            <div class="mb-3">
              <label for="tipo_transporte" class="form-label"
                >Tipo de transporte</label
              >
              <select class="form-select" id="tipo_transporte">
                <option value="">— Selecciona —</option>
                <option value="Bicicleta">Bicicleta</option>
                <option value="Caminata">Caminata</option>
                <option value="Auto">Auto</option>
                <option value="Autobús">Autobús</option>
                <option value="Motocicleta">Motocicleta</option>
                <option value="Tren">Tren</option>
                <option value="Avión">Avión</option>
              </select>
            </div>

            <div class="mb-1">
              <label for="ducha_minutos" class="form-label"
                >Duración de la ducha</label
              >
              <div class="input-group">
                <input
                  type="number"
                  class="form-control"
                  id="ducha_minutos"
                  placeholder="0"
                  min="0"
                />
                <span class="input-group-text">minutos</span>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button
              type="button"
              class="btn btn-success flex-grow-1"
              id="btnGuardar"
            >
              <i class="bi bi-floppy-fill me-1"></i>Guardar
            </button>
            <a href="index.html" class="btn btn-outline-secondary"
              ><i class="bi bi-x-lg me-1"></i>Cancelar</a
            >
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script src="../app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const id = obtenerIdDeURL();

        if (id) {
          document.getElementById("tituloFormulario").innerHTML =
            '<i class="bi bi-pencil-square me-2"></i>Editar Registro Diario';
          cargarRegistroEnFormulario(id);
        } else {
          // Fecha de hoy por defecto
          document.getElementById("fecha").value = new Date()
            .toISOString()
            .split("T")[0];
        }

        document
          .getElementById("btnGuardar")
          .addEventListener("click", () => guardarRegistroDiario(id));
      });
    </script>
  </body>
</html>
