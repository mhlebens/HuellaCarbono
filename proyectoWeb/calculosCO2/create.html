<!doctype html>
<html lang="es">
  <head>
    <title>Crear / Editar Cálculo CO2 - HuellaCarbono</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --verde: #2e7d32;
        --verde-claro: #4caf50;
      }
      body {
        background-color: #f1f8e9;
      }
      .navbar {
        background-color: var(--verde) !important;
      }
      .titulo-pagina {
        color: var(--verde);
        font-weight: 700;
        border-left: 4px solid var(--verde-claro);
        padding-left: 10px;
      }
      .card-form {
        border: none;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .btn-guardar {
        background-color: var(--verde-claro);
        border: none;
      }
      .btn-guardar:hover {
        background-color: var(--verde);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">
          <i class="bi bi-leaf-fill me-2"></i>HuellaCarbono DB
        </a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html">
            <i class="bi bi-arrow-left me-1"></i>Volver a Cálculos CO2
          </a>
        </div>
      </div>
    </nav>

    <div class="container py-4" style="max-width: 640px">
      <h3 class="titulo-pagina mb-4" id="tituloFormulario">
        <i class="bi bi-cloud-fill me-2"></i>Nuevo Cálculo CO2
      </h3>

      <div id="alerta" class="alert d-none" role="alert"></div>

      <div class="card card-form">
        <div class="card-body p-4">
          <div class="mb-3">
            <label for="id_calculo" class="form-label fw-semibold"
              >ID Cálculo</label
            >
            <input
              type="number"
              class="form-control"
              id="id_calculo"
              min="1"
              placeholder="Ej: 1"
              required
            />
          </div>

          <div class="mb-3">
            <label for="usuario_id" class="form-label fw-semibold"
              >Usuario</label
            >
            <select class="form-select" id="usuario_id" required>
              <option value="">Seleccione un usuario...</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="mes" class="form-label fw-semibold">Mes</label>
            <select class="form-select" id="mes" required>
              <option value="">Seleccione un mes...</option>
              <option value="Enero">Enero</option>
              <option value="Febrero">Febrero</option>
              <option value="Marzo">Marzo</option>
              <option value="Abril">Abril</option>
              <option value="Mayo">Mayo</option>
              <option value="Junio">Junio</option>
              <option value="Julio">Julio</option>
              <option value="Agosto">Agosto</option>
              <option value="Septiembre">Septiembre</option>
              <option value="Octubre">Octubre</option>
              <option value="Noviembre">Noviembre</option>
              <option value="Diciembre">Diciembre</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="total_emisiones" class="form-label fw-semibold"
              >Total Emisiones</label
            >
            <input
              type="number"
              step="0.01"
              min="0"
              class="form-control"
              id="total_emisiones"
              placeholder="Ej: 120.5"
              required
            />
          </div>

          <div class="mb-4">
            <label for="unidad" class="form-label fw-semibold">Unidad</label>
            <input
              type="text"
              class="form-control"
              id="unidad"
              value="kg"
              readonly
              required
            />
          </div>

          <div class="d-flex gap-2">
            <button
              type="button"
              class="btn btn-guardar btn-success text-white flex-grow-1"
              id="btnGuardar"
            >
              <i class="bi bi-floppy-fill me-1"></i>Guardar
            </button>
            <a href="index.html" class="btn btn-outline-secondary">
              <i class="bi bi-x-lg me-1"></i>Cancelar
            </a>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="../app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const id = obtenerIdDeURL();
        await cargarUsuariosEnSelect("usuario_id");
        document.getElementById("unidad").value = "kg";

        if (id) {
          document.getElementById("tituloFormulario").innerHTML =
            '<i class="bi bi-pencil-square me-2"></i>Editar Cálculo CO2';
          await cargarCalculoCO2EnFormulario(id);
        }

        document
          .getElementById("btnGuardar")
          .addEventListener("click", () => guardarCalculoCO2(id));
      });
    </script>
  </body>
</html>
